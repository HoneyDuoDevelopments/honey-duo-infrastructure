services:
  vaultwarden:
    image: vaultwarden/server:1.34.0
    container_name: vaultwarden
    restart: unless-stopped
    
    environment:
      - DOMAIN=https://vault.honey-duo.com
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SHOW_PASSWORD_HINT=false
      - LOG_LEVEL=info
      - EXTENDED_LOGGING=true
      - DATABASE_MAX_CONNS=10
      - WEB_VAULT_ENABLED=true
      
    volumes:
      - ./data:/data
      
    ports:
      - "8080:80"
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 3s
      retries: 3

  vaultwarden-backup:
    image: ttionya/vaultwarden-backup:latest
    container_name: vaultwarden-backup
    restart: unless-stopped
    depends_on:
      - vaultwarden
      
    environment:
      - RCLONE_REMOTE_NAME=onedrive
      - RCLONE_REMOTE_DIR=/Backups/Vaultwarden
      - CRON=0 2 * * *
      - ZIP_ENABLE=true
      - ZIP_PASSWORD=${BACKUP_PASSWORD}
      - ZIP_TYPE=7z
      - BACKUP_KEEP_DAYS=30
      - BACKUP_FILE_SUFFIX=%Y%m%d-%H%M%S
      - TIMEZONE=America/Los_Angeles
      
    volumes:
      - ./data:/bitwarden/data:ro
      - /home/honeyduopi/.config/rclone:/config/rclone:ro
